<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>محلل الأسهم الأمريكية</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== الشريط العلوي ===== -->
  <header class="topbar">
    <div class="status market-status" id="marketStatus">
      <span class="dot"></span>
      <span class="label">جاري التحميل...</span>
    </div>

    <div class="status connection-status" id="connectionStatus">
      <span class="dot"></span>
      <span class="label">غير متصل</span>
    </div>

    <button class="theme-btn" id="themeBtn" title="تبديل الخلفية">
      <span id="themeIcon">🌙</span>
    </button>
  </header>

  <!-- ===== مربع البحث ===== -->
  <section class="search-section">
    <form class="search-box" id="searchForm">
      <button type="submit" class="search-btn" title="بحث">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
      <input
        type="text"
        id="symbolInput"
        placeholder="اكتب رمز السهم..."
        autocomplete="off"
        spellcheck="false"
      />
    </form>
  </section>

  <!-- ===== منطقة البطاقات ===== -->
  <main class="cards-area" id="cardsArea"></main>

  <!-- ===== حالة الفراغ ===== -->
  <div class="empty-state" id="emptyState">
    <p>ابحث عن رمز سهم لعرض التحليل</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
